version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DOMAIN=${DOMAIN}
      - SOLANA_WALLET_ADDRESS=${SOLANA_WALLET_ADDRESS}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    volumes:
      - ./app:/code/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5

  conduit:
    image: matrixconduit/matrix-conduit:latest
    restart: always
    environment:
      CONDUIT_CONFIG: ""
      CONDUIT_SERVER_NAME: "askpc.cc"
      CONDUIT_DATABASE_PATH: "/var/lib/matrix-conduit"
      CONDUIT_DATABASE_BACKEND: "rocksdb"
      CONDUIT_ADDRESS: "0.0.0.0"
      CONDUIT_PORT: 6167
      CONDUIT_MAX_REQUEST_SIZE: 20000000
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
    volumes:
      - conduit_data:/var/lib/matrix-conduit
    depends_on:
      - db

  bot:
      build: .
      command: python matrix_bot.py
      restart: always
      environment:
        - DATABASE_URL=${DATABASE_URL}
        - MATRIX_HOMESERVER=https://matrix.askpc.cc
        - MATRIX_BOT_USER=${MATRIX_BOT_USER}
        - MATRIX_BOT_PASSWORD=${MATRIX_BOT_PASSWORD}
      volumes:
        - ./matrix_bot.py:/code/matrix_bot.py  # Проброс файла бота
        - ./app:/code/app
      depends_on:
        - conduit
        - db

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - conduit

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  conduit_data:
