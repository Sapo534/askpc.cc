<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — computer.help</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <a href="/" class="logo">computer.help</a>
        </div>
    </header>

    <main class="container">
        <div class="static-page" style="max-width: 400px; margin-top: 40px;">
            <h1 style="text-align: center; margin-bottom: 20px;">Join Community</h1>

            <!-- OAuth Options -->
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <a href="/auth/github" class="btn btn-outline" style="text-align: center;">Register with GitHub</a>
                <a href="/auth/google" class="btn btn-outline" style="text-align: center;">Register with Google</a>
                <a href="/auth/vk" class="btn btn-outline" style="text-align: center;">Register with VK</a>
            </div>

            <div style="text-align: center; color: var(--text-secondary); margin-bottom: 20px;">or with email</div>

            <!-- Error Notification Banner -->
            {% if error %}
            <div class="notice-banner" style="border-left-color: #ff0000; color: #ff0000; margin-bottom: 15px;">
                {{ error }}
            </div>
            {% endif %}

            <!-- Registration Form -->
            <form action="/auth/register" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary);">Username</label>
                    <input type="text" name="username" placeholder="sysadmin_42" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary);">Email</label>
                    <input type="email" name="email" placeholder="user@domain.com" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary);">Password</label>
                    <input type="password" name="password" minlength="6" placeholder="••••••••" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 4px;">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Create Account</button>
            </form>

            <p style="text-align: center; font-size: 0.85rem; margin-top: 20px; color: var(--text-secondary);">
                Already registered? <a href="/login" style="text-decoration: underline;">Log In</a>
            </p>
        </div>
    </main>
</body>
</html>
