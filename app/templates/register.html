{% set c = new_challenge() %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — askpc.cc</title>
    <link rel="stylesheet" href="/static/style.css?v={{ static_v('style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <a href="/" class="logo">askpc.cc</a>
        </div>
    </header>

    <main class="container">
        <div class="static-page" style="max-width: 400px; margin-top: 40px;">
            <h1 style="text-align: center; margin-bottom: 20px;">Join Community</h1>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <a href="/auth/github" class="btn btn-outline" style="text-align: center;">Register with GitHub</a>
            </div>

            <div style="text-align: center; color: var(--text-secondary); margin-bottom: 20px;">or with email</div>

            {% if error %}
            <div class="notice-banner" style="border-left-color: #ff0000; color: #ff0000; margin-bottom: 15px;">
                {{ error }}
            </div>
            {% endif %}

            <form id="register-form" action="/auth/register" method="POST" data-salt="{{ c.salt }}" data-bits="{{ c.bits }}" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="hidden" name="challenge" value="{{ c.token }}">
                <input type="hidden" name="pow_nonce" value="">
                <div aria-hidden="true" style="position: absolute; left: -10000px;">
                    <label>Website (leave empty)</label>
                    <input type="text" name="website" tabindex="-1" autocomplete="off">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary);">Username</label>
                    <input type="text" name="username" placeholder="User" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-]{3,32}" autocomplete="username" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary);">Email</label>
                    <input type="email" name="email" placeholder="user@domain.com" required maxlength="254" autocomplete="email" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary);">Password</label>
                    <input type="password" name="password" minlength="8" maxlength="128" placeholder="••••••••" required autocomplete="new-password" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 4px;">
                </div>
                <button type="submit" id="register-submit" class="btn" disabled style="width: 100%; margin-top: 10px;">Create Account</button>
                <noscript><p>JavaScript is required to create an account (anti-spam check).</p></noscript>
            </form>

            <p style="text-align: center; font-size: 0.85rem; margin-top: 20px; color: var(--text-secondary);">
                Already registered? <a href="/login" style="text-decoration: underline;">Log In</a>
            </p>
        </div>
    </main>
    <script src="/static/pow.js?v={{ static_v('pow.js') }}" defer></script>
</body>
</html>
