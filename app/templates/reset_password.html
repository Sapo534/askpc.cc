{% extends "base.html" %}

{% block title %}Set New Password — askpc.cc{% endblock %}

{% block content %}
<div class="static-page" style="max-width: 400px; margin-top: 40px;">
    <h1 style="text-align: center; margin-bottom: 20px;">Set New Password</h1>

    {% if error %}
    <div class="notice-banner" style="border-left-color: var(--error); color: var(--error); margin-bottom: 20px;">
        {{ error }}
    </div>
    {% endif %}

    <form action="/reset-password" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <input type="hidden" name="token" value="{{ token }}">
        <input type="password" name="new_password" minlength="6" placeholder="New password (min 6 chars)" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px;">
        <button type="submit" class="btn" style="width: 100%;">Save New Password</button>
    </form>
</div>
{% endblock %}
